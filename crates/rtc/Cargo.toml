[package]
name = "phonecam-rtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PhoneCam WebRTC receiver, jitter buffer, adaptasi bitrate"

[dependencies]
phonecam-core = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
async-trait = { workspace = true }
# ponytail: non-default features — default webrtc `crypto-ring` vs rustls
# aws-lc-rs workspace → rustls 0.23 CryptoProvider ambiguity panic. Kita pakai
# aws-lc-rs (sudah aktif via rustls workspace) untuk konsistensi TLS stack.
webrtc = { version = "0.21.1", default-features = false, features = [
    "runtime-tokio",
    "crypto-aws-lc-rs",
] }
rtc = { version = "0.21.1", default-features = false }
