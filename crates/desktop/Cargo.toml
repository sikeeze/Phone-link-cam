[package]
name = "phonecam-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PhoneCam desktop app: server HTTPS pairing + signaling (Phase 1)"

[[bin]]
name = "phonecam-desktop"
path = "src/main.rs"

[dependencies]
phonecam-core = { workspace = true }
phonecam-rtc = { version = "0.1.0", path = "../rtc" }
phonecam-media = { workspace = true }
phonecam-vcam = { workspace = true }
phonecam-vmic = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
mime_guess = { workspace = true }
rust-embed = { workspace = true }
clap = { workspace = true }
url = { workspace = true }
local-ip-address = { workspace = true }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tauri = { version = "2.11.6", features = ["tray-icon"] }

[build-dependencies]
tauri-build = "2.6.3"
